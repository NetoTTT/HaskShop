name: HaskShop
version: 1.1.0
main: com.hask.shop.HaskShop
depend: [Vault]
softdepend: [Citizens, HaskCash]

commands:
  hs:
    description: Gerencia lojas em placas e NPCs
    usage: /hs <add|edit|remove|info|list|npcshop|items|give|reload>
    permission: shopsign.admin
  xpdebug:
    description: Mostra XP do mcMMO na action bar (debug)
    aliases: [xpd]
    permission: shopsign.admin
  booster:
    description: Admin do sistema de booster mcMMO
    permission: shopsign.admin
  shop:
    description: Loja de itens por cash
    aliases: [loja]

permissions:
  shopsign.admin:
    description: Permite criar e gerenciar lojas
    default: op
  shopsign.use:
    description: Permite usar lojas
    default: true
